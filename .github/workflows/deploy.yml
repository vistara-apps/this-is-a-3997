name: Deploy to Vercel

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build
      env:
        NODE_OPTIONS: --max-old-space-size=4096
        
    - name: Deploy to Vercel (Production)
      if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && secrets.VERCEL_TOKEN
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-args: '--prod'
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        
    - name: Deploy to Vercel (Preview)
      if: (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master') && secrets.VERCEL_TOKEN
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-args: '--no-wait'
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        
    - name: Build Success Notification
      if: success()
      run: |
        echo "✅ Build completed successfully!"
        echo "📦 Build artifacts are ready in the 'dist' directory"
        echo "🚀 To deploy, configure Vercel secrets in repository settings:"
        echo "   - VERCEL_TOKEN"
        echo "   - VERCEL_ORG_ID" 
        echo "   - VERCEL_PROJECT_ID"
        
    - name: Comment PR with build status
      if: github.event_name == 'pull_request' && success()
      uses: actions/github-script@v7
      with:
        script: |
          const hasVercelSecrets = '${{ secrets.VERCEL_TOKEN }}' !== '';
          const message = hasVercelSecrets 
            ? `🚀 **Preview Deployment Ready!**\n\n📱 Check the Vercel dashboard for deployment URL\n\nThis preview will be automatically updated when you push new commits to this PR.`
            : `✅ **Build Completed Successfully!**\n\n📦 The application built without errors\n🚀 To enable automatic deployments, configure Vercel secrets in repository settings\n\n**Required secrets:**\n- \`VERCEL_TOKEN\`\n- \`VERCEL_ORG_ID\`\n- \`VERCEL_PROJECT_ID\``;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: message
          });
